name: Bug report
description: Something in Briefly does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the URL parameters you used (for example `?t=web&lang=ar`).
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - French
        - Arabic
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 19 on iPhone 16, Chrome 142 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
      description: Do not paste real client answers or personal data.
